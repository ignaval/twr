<text x="106.4" y="441.5" fill="#949494" textLength="33.6">tool</text>
<text x="148.4" y="441.5" fill="#6e7681" textLength="151.2">(ctrl+o to expand)</text>
<text x="14" y="477.5" fill="#c9d1d9" textLength="369.6">● Sent to ratelimit. I'll tell you when it's</text>
