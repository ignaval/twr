<text x="30.8" y="315.5" fill="#c9d1d9" textLength="369.6">Tax is now rounded once on the invoice total</text>
<text x="30.8" y="333.5" fill="#c9d1d9" textLength="344.4">instead of per line. The 12 invoice tests</text>
