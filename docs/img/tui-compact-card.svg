<text x="249.2" y="27.5" fill="#ffd700" class="b" textLength="84">Threads ⚠1</text>
<text x="30.8" y="63.5" fill="#39c5cf" class="b" textLength="134.4">invoice-rounding</text>
<text x="324.8" y="63.5" fill="#39c5cf">✕</text>
<text x="39.2" y="81.5" fill="#1b1f24" class="b" textLength="67.2">QUESTION</text>
<text x="30.8" y="99.5" fill="#c9d1d9" textLength="277.2">Round tax per line or once on the</text>
<text x="30.8" y="117.5" fill="#c9d1d9" textLength="294">invoice total? Per line matches the</text>
<text x="30.8" y="135.5" fill="#c9d1d9" textLength="260.4">PDF invoices; once on the total</text>
<text x="30.8" y="153.5" fill="#c9d1d9" textLength="294">matches the ledger, which posts one</text>
<text x="30.8" y="171.5" fill="#c9d1d9" textLength="184.8">tax amount per invoice</text>
<text x="30.8" y="189.5" fill="#c9d1d9" textLength="302.4">(src/ledger/post.rs). They differ by</text>
<text x="30.8" y="207.5" fill="#c9d1d9" textLength="294">a cent on 214 of last month's 9 880</text>
