<text x="207.2" y="117.5" fill="#6e7681" textLength="67.2">scripte…</text>
<text x="299.6" y="117.5" fill="#6e7681" textLength="33.6">auto</text>
<text x="358.4" y="117.5" fill="#949494">❯</text>
<text x="375.2" y="117.5" fill="#ffffff" textLength="663.6">Two things. On api, rate limit logins per IP. On billing, round tax once on the</text>
