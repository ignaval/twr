<text x="358.4" y="81.5" fill="#c9d1d9" textLength="554.4">● Morning. I'll watch the threads and tell you when one needs you.</text>
<text x="14" y="99.5" fill="#39c5cf">▌</text>
<text x="39.2" y="99.5" fill="#6e7681" textLength="285.6">invoice-rounding on billing. I'll…</text>
