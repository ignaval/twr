<text x="358.4" y="405.5" fill="#87afff" textLength="67.2">↓ 5 more</text>
<text x="459.2" y="405.5" fill="#b1bac4" textLength="840">60. It uses a paused clock, so it runs in milliseconds. Running the auth tests to check nothing else</text>
<text x="14" y="423.5" fill="#39c5cf">▌</text>
<text x="459.2" y="423.5" fill="#b1bac4" textLength="50.4">broke.</text>
<text x="14" y="441.5" fill="#39c5cf">▌</text>
<text x="14" y="459.5" fill="#39c5cf">▌</text>
<text x="459.2" y="459.5" fill="#d29922" class="b">1</text>
<text x="476" y="459.5" fill="#c9d1d9" textLength="42">allow</text>
<text x="534.8" y="459.5" fill="#d29922" class="b">2</text>
<text x="551.6" y="459.5" fill="#c9d1d9" textLength="33.6">deny</text>
<text x="14" y="477.5" fill="#39c5cf">▌</text>
<text x="14" y="495.5" fill="#39c5cf">▌</text>
<text x="14" y="513.5" fill="#39c5cf">▌</text>
<text x="39.2" y="513.5" fill="#6e7681" textLength="302.4">1 parked hidden · /parked shows them</text>
<text x="442.4" y="513.5" fill="#949494">❯</text>
<text x="459.2" y="513.5" fill="#ffffff" textLength="201.6">What needs me right now?</text>
<text x="39.2" y="549.5" fill="#c9d1d9" class="b" textLength="67.2">client-x</text>
<text x="383.6" y="549.5" fill="#d29922" class="b" textLength="16.8">⚠1</text>
<text x="408.8" y="549.5" fill="#c9d1d9" class="b" textLength="16.8">●1</text>
<text x="459.2" y="549.5" fill="#949494" textLength="50.4">Called</text>
<text x="518" y="549.5" fill="#949494" class="b">2</text>
