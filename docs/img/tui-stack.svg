<text x="39.2" y="63.5" fill="#d29922" class="b" textLength="201.6">working · waiting on you</text>
<text x="442.4" y="63.5" fill="#c9d1d9" textLength="798">● deploy-fix failed: turn 1 failed: terraform plan failed: the state lock is held by run 81719.</text>
<text x="14" y="81.5" fill="#39c5cf">▌</text>
<text x="39.2" y="81.5" fill="#6e7681" textLength="394.8">Three things. ratelimit wants to run cargo test</text>
<text x="14" y="99.5" fill="#39c5cf">▌</text>
<text x="39.2" y="99.5" fill="#6e7681" textLength="386.4">-p api auth:: to check its new login limiter:…</text>
<text x="467.6" y="99.5" fill="#87afff" class="b" textLength="226.8">invoice-rounding · question</text>
<text x="14" y="117.5" fill="#39c5cf">▌</text>
<text x="47.6" y="117.5" fill="#6e7681" textLength="42">api ·</text>
<text x="98" y="117.5" fill="#008700" class="b" textLength="75.6">ratelimit</text>
<text x="249.2" y="117.5" fill="#6e7681" textLength="109.2">fake · fake-1</text>
<text x="383.6" y="117.5" fill="#6e7681" textLength="33.6">auto</text>
<text x="459.2" y="117.5" fill="#c9d1d9" textLength="848.4">Round tax per line or once on the invoice total? Per line matches the PDF invoices; once on the total</text>
<text x="14" y="135.5" fill="#39c5cf">▌</text>
<text x="39.2" y="135.5" fill="#d29922" class="b" textLength="58.8">waiting</text>
<text x="459.2" y="135.5" fill="#c9d1d9" textLength="882">matches the ledger, which posts one tax amount per invoice (src/ledger/post.rs). They differ by a cent on</text>
<text x="14" y="153.5" fill="#39c5cf">▌</text>
<text x="47.6" y="153.5" fill="#1b1f24" class="b" textLength="84">PERMISSION</text>
<text x="148.4" y="153.5" fill="#c9d1d9" textLength="92.4">Allow Bash?</text>
<text x="459.2" y="153.5" fill="#c9d1d9" textLength="823.2">214 of last month's 9 880 invoices. Matching the ledger changes those PDFs if they are sent again;</text>
<text x="14" y="171.5" fill="#39c5cf">▌</text>
<text x="39.2" y="171.5" fill="#d29922" class="b">1</text>
<text x="56" y="171.5" fill="#c9d1d9" textLength="42">allow</text>
<text x="114.8" y="171.5" fill="#d29922" class="b">2</text>
<text x="131.6" y="171.5" fill="#c9d1d9" textLength="33.6">deny</text>
<text x="459.2" y="171.5" fill="#c9d1d9" textLength="638.4">matching the PDFs means migrating posted entries. Which should totals.rs do?</text>
<text x="14" y="189.5" fill="#39c5cf">▌</text>
<text x="39.2" y="189.5" fill="#d29922" textLength="386.4">twr/627f9be2730e0… · changes made · +1 vs main</text>
<text x="14" y="207.5" fill="#39c5cf">▌</text>
<text x="459.2" y="207.5" fill="#6e7681" textLength="42">task:</text>
<text x="509.6" y="207.5" fill="#b1bac4" textLength="319.2">Checking how invoice totals round tax.</text>
<text x="14" y="225.5" fill="#39c5cf">▌</text>
<text x="47.6" y="225.5" fill="#87afff" class="b" textLength="134.4">invoice-rounding</text>
<text x="249.2" y="225.5" fill="#6e7681" textLength="109.2">fake · fake-1</text>
<text x="383.6" y="225.5" fill="#6e7681" textLength="33.6">auto</text>
<text x="459.2" y="225.5" fill="#6e7681" textLength="42">said:</text>
<text x="509.6" y="225.5" fill="#b1bac4" textLength="319.2">Checking how invoice totals round tax.</text>
<text x="14" y="243.5" fill="#39c5cf">▌</text>
<text x="39.2" y="243.5" fill="#d29922" class="b" textLength="58.8">waiting</text>
<text x="14" y="261.5" fill="#39c5cf">▌</text>
<text x="47.6" y="261.5" fill="#1b1f24" class="b" textLength="67.2">QUESTION</text>
<text x="131.6" y="261.5" fill="#c9d1d9" textLength="277.2">Round tax per line or once on the</text>
<text x="459.2" y="261.5" fill="#d29922" class="b">1</text>
<text x="476" y="261.5" fill="#c9d1d9" textLength="176.4">per line, as the PDFs</text>
