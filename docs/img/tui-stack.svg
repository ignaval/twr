<text x="22.4" y="27.5" fill="#6e7681" class="b" textLength="58.8">THREADS</text>
<text x="417.2" y="27.5" fill="#6e7681">‹</text>
<text x="450.8" y="27.5" fill="#000000" class="b" textLength="100.8">ORCHESTRATOR</text>
<text x="568.4" y="27.5" fill="#000000" textLength="134.4">acp · scripted-1</text>
