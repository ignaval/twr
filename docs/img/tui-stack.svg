<text x="686" y="261.5" fill="#c9d1d9" textLength="268.8">once on the total, as the ledger</text>
<text x="14" y="279.5" fill="#39c5cf">▌</text>
<text x="39.2" y="279.5" fill="#c9d1d9" textLength="327.6">invoice total? Per line matches the PDF</text>
<text x="14" y="297.5" fill="#39c5cf">▌</text>
<text x="39.2" y="297.5" fill="#c9d1d9" textLength="327.6">invoices; once on the total matches the</text>
<text x="14" y="315.5" fill="#39c5cf">▌</text>
<text x="39.2" y="315.5" fill="#c9d1d9" textLength="386.4">ledger, which posts one tax amount per invoice</text>
<text x="467.6" y="315.5" fill="#008700" class="b" textLength="184.8">ratelimit · permission</text>
<text x="14" y="333.5" fill="#39c5cf">▌</text>
<text x="39.2" y="333.5" fill="#c9d1d9" textLength="386.4">(src/ledger/post.rs). They differ by a cent on</text>
<text x="459.2" y="333.5" fill="#c9d1d9" textLength="92.4">Allow Bash?</text>
<text x="14" y="351.5" fill="#39c5cf">▌</text>
<text x="39.2" y="351.5" fill="#c9d1d9" textLength="369.6">214 of last month's 9 880 invoices. Matching</text>
<text x="14" y="369.5" fill="#39c5cf">▌</text>
<text x="39.2" y="369.5" fill="#c9d1d9" textLength="386.4">the ledger changes those PDFs if they are sent</text>
<text x="459.2" y="369.5" fill="#6e7681" textLength="42">task:</text>
<text x="509.6" y="369.5" fill="#b1bac4" textLength="680.4">I'll add a per-IP limit to POST /login. First, how a request reaches the handler.</text>
<text x="14" y="387.5" fill="#39c5cf">▌</text>
<text x="39.2" y="387.5" fill="#c9d1d9" textLength="336">again; matching the PDFs means migrating</text>
<text x="459.2" y="387.5" fill="#6e7681" textLength="42">said:</text>
<text x="509.6" y="387.5" fill="#b1bac4" textLength="823.2">Added a test: six logins from one IP inside a minute, and the sixth must get 429 with Retry-After:</text>
