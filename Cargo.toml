[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/ignaval/twr"

[workspace.dependencies]
twr-core = { path = "crates/twr-core" }
twr-link = { path = "crates/twr-link" }
twr-source = { path = "crates/twr-source" }
twr-adapters = { path = "crates/twr-adapters" }
twr-decisions = { path = "crates/twr-decisions" }
twr-runner = { path = "crates/twr-runner" }
twr-hub = { path = "crates/twr-hub" }
twr-mcp = { path = "crates/twr-mcp" }
twr-tui = { path = "crates/twr-tui" }
twr-docs = { path = "crates/twr-docs" }
twr-avspeech = { path = "crates/twr-avspeech" }
twr-speech = { path = "crates/twr-speech" }
twr-voice = { path = "crates/twr-voice" }

tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
# `raw_value`: event payloads parse straight into their types (`twr_core::event`).
# `float_roundtrip`: a float reads back as the same float (the hub's checkpoints hold sums of
# costs, `twr_hub` `hub::checkpoint`).
serde_json = { version = "1", features = ["raw_value", "float_roundtrip"] }
rusqlite = { version = "0.41", features = ["bundled"] }
ulid = "3"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
sha2 = "0.11"
hex = "0.4"
toml = "1"
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
clap = { version = "4", features = ["derive"] }
# `twr completions`: shell completion scripts from the clap definition.
clap_complete = "4"
ratatui = "0.30"
crossterm = "0.29"
# The TUI's markdown (replies drawn as Claude Code draws them): the parser only, no HTML.
pulldown-cmark = { version = "0.13", default-features = false }
tempfile = "3"
portable-pty = "0.9"
rmcp = { version = "3.9", default-features = false, features = ["server", "transport-io", "macros"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# The hub's runner listener over TLS (wss://): the same rustls with ring.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# `twr update`'s HTTP client and the mobile gateway's APNs/FCM client: rustls, no OpenSSL, the
# same reqwest as iroh's. `rustls-no-provider` because each client is handed its own rustls
# configuration (ring, the Mozilla roots of `webpki-roots`: `https_client` in twr-cli,
# `push_tls` in twr-app) in place of 0.13's platform verifier and aws-lc-rs default.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
# The roots those HTTP clients trust (reqwest 0.12's `rustls-tls` used the same crate).
webpki-roots = "1"
# macOS's mount list (`getfsstat`) for twr-runner's trims and deletions.
libc = "0.2"
# twr-runner's shutdown latch (`client::Shutdown`): an action in the SIGTERM / SIGINT handler
# itself, next to Tokio's (which goes through the same registry).
signal-hook-registry = "1.4"
# `twr update` checks the release's Ed25519 signatures: the ring rustls already builds.
ring = "0.17.14"
# twr-avspeech (macOS only): AVFAudio's AVSpeechSynthesizer through objc2's bindings, with
# only the features it uses.
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSArray", "NSObject"] }
objc2-avf-audio = { version = "0.3.2", default-features = false, features = ["std", "AVSpeechSynthesis"] }

# Dev and test builds (`test` inherits `dev`) keep only line tables: panics and backtraces still
# name file and line, and debuggers can step by line, but the variables and types of full
# debuginfo are gone. Full debuginfo was three quarters of each test binary (~250 MB each, 48
# of them), and a worktree's `target/` halves with this (docs/development.md#disk-usage). For a
# debugging session: CARGO_PROFILE_DEV_DEBUG=full cargo build.
[profile.dev]
debug = "line-tables-only"

# Release binaries (the GitHub release workflow builds these). `panic` stays `unwind`: tokio
# turns a panicking task into a JoinError instead of taking the hub down.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Temporary API-compatible re-export until iroh adopts netwatch 0.20.
# This keeps the maintained netlink backend without ignoring RustSec advisories.
[patch.crates-io]
netwatch = { path = "compat/netwatch" }
