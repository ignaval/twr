[package]
name = "twr-relay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "twr's relay: phone passthrough, iroh relay and record store on one port (docs/relay-protocol.md)"

[dependencies]
anyhow.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
hex.workspace = true
ring.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
webpki-roots.workspace = true
futures.workspace = true
libc.workspace = true
base64 = "0.23.1"
bytes = "1"
http = "1"
http-body-util = "0.1"
# The client's HTTPS calls (admission, info, status) and, with `server`, the HTTPS API.
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# The hub connection's streams (docs/relay-protocol.md §5.1).
yamux = "0.13"
tokio-util = { version = "0.7", features = ["compat", "rt"] }

# Server only (`server`): the gateway, twr-link and the desktop app use the client without these.
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"], optional = true }
# Let's Encrypt (tls-alpn-01) for the relay's own names; the same crate iroh-relay's server uses.
tokio-rustls-acme = { version = "0.9.1", default-features = false, features = ["rustls-tls-webpki-roots"], optional = true }
# iroh's relay server for linked runners, at twr-link's iroh version (§10).
iroh-relay = { version = "=1.4.1", default-features = false, features = ["server", "tls-ring"], optional = true }
iroh-base = { version = "=1.4.1", default-features = false, optional = true }
async-trait = { version = "0.1", optional = true }
# `twr relay probe`'s iroh check: the iroh relay client needs a resolver, unused for IP URLs.
iroh-dns = { version = "=1.4.1", default-features = false, optional = true }

[features]
default = []
server = [
    "dep:rcgen",
    "dep:tokio-rustls-acme",
    "dep:iroh-relay",
    "dep:iroh-base",
    "dep:async-trait",
    "dep:iroh-dns",
    "hyper/server",
    "hyper/http2",
    "hyper-util/server",
    "hyper-util/server-auto",
]

[dev-dependencies]
tempfile.workspace = true
# The record store against pkarr's own packets (docs/relay-protocol.md §9), at twr-link's version.
pkarr = { version = "=8.1.0", default-features = false, features = ["signed_packet"] }

[[test]]
name = "conformance"
required-features = ["server"]

[[test]]
name = "parse_fuzz"
required-features = ["server"]

[[test]]
name = "acme"
required-features = ["server"]
