[package]
name = "twr-runner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
repository.workspace = true

[dependencies]
twr-core.workspace = true
twr-adapters.workspace = true
anyhow.workspace = true
futures.workspace = true
rusqlite.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
# The box's machine lock name (`client::machine_lock_path`).
sha2.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
# `twr runner --clone-repo`'s git: its process group, the terminal's foreground group, and
# `waitid`; on macOS also the mount points (`getfsstat(2)`), which trimming and deleting
# build output need.
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
tracing-subscriber.workspace = true

[lints.rust]
# `--cfg twr_ps` reads the process table with `ps` (the macOS backend of `reap`) on Linux too,
# so CI can run its tests there.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(twr_ps)"] }
