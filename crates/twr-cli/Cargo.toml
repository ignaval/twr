[package]
name = "twr-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
repository.workspace = true
description = "twr: a control tower for parallel coding agents"

[[bin]]
name = "twr"
path = "src/main.rs"

[features]
default = ["neural"]
# twr's own voices (`twr voices install`, docs/read-aloud.md#twrs-voices): sherpa-onnx's
# prebuilt libraries and an audio output. The static musl release builds without it.
neural = ["dep:twr-neural", "twr-speech/neural"]

[dependencies]
twr-adapters.workspace = true
twr-core.workspace = true
twr-link.workspace = true
twr-hub.workspace = true
twr-mcp.workspace = true
twr-runner.workspace = true
# `twr speak` and `twr remote`: the speaker (docs/read-aloud.md).
twr-speech.workspace = true
# `twr voices`: the catalog of twr's local voices, installing and timing them (`neural`).
twr-neural = { workspace = true, optional = true }
twr-voice.workspace = true
twr-tui.workspace = true
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
clap_complete.workspace = true
hex.workspace = true
# `term::read_hidden_line`: the terminal's settings (termios).
libc.workspace = true
reqwest.workspace = true
ring.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
# `twr voices render`: audio for the mobile gateway, as base64 in JSON lines.
base64 = "0.23.1"
# Private, unique, automatically cleaned voice model downloads.
tempfile.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
twr-docs.workspace = true
crossterm.workspace = true
portable-pty.workspace = true

[build-dependencies]
twr-source.workspace = true
tokio.workspace = true
serde_json.workspace = true
anyhow.workspace = true
