name: Release

# Push a tag `v<version>` matching the workspace version (Cargo.toml) to build the release
# binaries and publish a GitHub Release with them. A tag with a `-` (v0.2.0-rc.1) makes a
# prerelease, which install.sh skips unless TWR_VERSION names it. `workflow_dispatch` from
# `main` rebuilds an existing tag and replaces its assets; from any other branch it refuses.
#
# Actions are pinned to full commit SHAs (the comment names the release); the Rust toolchain is
# the one in rust-toolchain.toml at the tagged commit.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release (e.g. v0.2.0)
        required: true

permissions:
  contents: read

# One run per tag at a time: a new run waits instead of cancelling one that may be uploading.
# GitHub keeps one waiting run per group, so a newer run replaces the one still waiting.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # Resolves refs/tags/$TAG to its commit once, through the API (a branch with the same name
  # can't shadow it); every build checks out that commit and the release re-checks it.
  resolve:
    name: resolve the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - id: tag
        name: Resolve refs/tags/$TAG to a commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The grammar `twr update` accepts (is_release_tag): no build metadata.
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$TAG is not a v<version> tag"
            exit 1
          fi
          # The workflow file comes from the ref that started the run: only the tag itself, or
          # main for a manual rebuild, may publish (a branch could carry a modified workflow).
          case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
            "push:refs/tags/$TAG" | "workflow_dispatch:refs/heads/main") ;;
            *)
              echo "::error::releases run from the tag push or from main (workflow_dispatch), not $GITHUB_EVENT_NAME on $GITHUB_REF"
              exit 1
              ;;
          esac
          # The singular git/ref endpoint matches the exact ref only. Annotated (possibly
          # nested) tags are peeled down to their commit.
          if ! obj=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha'); then
            echo "::error::could not look up refs/tags/$TAG in $GH_REPO: no such tag, or the API call failed (gh's message is above)"
            exit 1
          fi
          read -r type sha <<< "$obj"
          for _ in 1 2 3 4 5; do
            [ "$type" = tag ] || break
            if ! obj=$(gh api "repos/$GH_REPO/git/tags/$sha" --jq '.object.type + " " + .object.sha'); then
              echo "::error::could not read the tag object $sha of refs/tags/$TAG (gh's message is above)"
              exit 1
            fi
            read -r type sha <<< "$obj"
          done
          if [ "$type" != commit ] || ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::refs/tags/$TAG does not name a commit ($type $sha)"
            exit 1
          fi
          # A tag push builds the commit the push named, which the provenance records: a tag that
          # was moved since (a re-run keeps the original event's commit) is refused.
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$sha" != "$GITHUB_SHA" ]; then
            echo "::error::refs/tags/$TAG is now $sha, but this run was started for $GITHUB_SHA: push the tag again instead of re-running"
            exit 1
          fi
          echo "refs/tags/$TAG -> $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.target }}
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static Linux binaries, cross-compiled with zig (cargo-zigbuild) for both arches.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, zig: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, zig: true }
          # macOS: the arm64 runner builds both (Xcode cross-compiles to Intel).
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Each leg sets only its own output; the release job checks the archive it downloads
    # against these.
    outputs:
      sha256_x86_64_unknown_linux_musl: ${{ steps.package.outputs.sha256_x86_64_unknown_linux_musl }}
      sha256_aarch64_unknown_linux_musl: ${{ steps.package.outputs.sha256_aarch64_unknown_linux_musl }}
      sha256_aarch64_apple_darwin: ${{ steps.package.outputs.sha256_aarch64_apple_darwin }}
      sha256_x86_64_apple_darwin: ${{ steps.package.outputs.sha256_x86_64_apple_darwin }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Check that the checkout is the tagged commit
        shell: bash
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          head=$(git rev-parse HEAD)
          if [ -z "$SHA" ] || [ "$head" != "$SHA" ]; then
            echo "::error::checked out $head, but refs/tags/$TAG is ${SHA:-unresolved}"
            exit 1
          fi

      - name: Install the Rust toolchain (rust-toolchain.toml)
        shell: bash
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"$/\1/p' rust-toolchain.toml)
          [ -n "$channel" ] || { echo "::error::no channel in rust-toolchain.toml"; exit 1; }
          rustup toolchain install "$channel" --profile minimal --target "$TARGET" --no-self-update
          version=$(rustc --version)
          case "$version" in
            "rustc $channel "*) echo "$version" ;;
            *) echo "::error::rustc is $version, rust-toolchain.toml says $channel"; exit 1 ;;
          esac

      - name: Check that the tag matches the version
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "twr-cli") | .version')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match the workspace version $version (expected v$version)"
            exit 1
          fi

      - name: Install zig and cargo-zigbuild
        if: matrix.zig
        run: |
          # The hashes are those of the x86_64 Linux wheels on PyPI.
          if [ "$(uname -m)" != x86_64 ]; then
            echo "::error::the pinned zig wheels are for x86_64 Linux, this runner is $(uname -m)"
            exit 1
          fi
          cat > "$RUNNER_TEMP/zig-requirements.txt" <<'REQ'
          cargo-zigbuild==0.23.4 --hash=sha256:0a149a2a07b9513d422efa9cc23e1add9741f08abe86845fa418eaeb4cca7931
          ziglang==0.14.1 --hash=sha256:6eb9d4d759b292c83810dbee2e9e8e3fbfbf01d864e6e9811bae711fd74e1c2f
          REQ
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install --quiet --require-hashes --only-binary :all: --no-deps \
            -r "$RUNNER_TEMP/zig-requirements.txt"
          echo "$RUNNER_TEMP/zig/bin" >> "$GITHUB_PATH"

      - name: Install qemu (to run the arm64 Linux build)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-user

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.zig }}" = "true" ]; then
            cargo zigbuild --release --locked -p twr-cli --target "$TARGET"
          else
            cargo build --release --locked -p twr-cli --target "$TARGET"
          fi

      - name: Check the binary
        shell: bash
        run: |
          bin="target/$TARGET/release/twr"
          desc=$(file -b "$bin")
          echo "$bin: $desc"
          case "$TARGET:$desc" in
            x86_64-*:*x86-64* | x86_64-*:*x86_64* | aarch64-*:*aarch64* | aarch64-*:*arm64*) ;;
            *) echo "::error::$bin is not a $TARGET binary"; exit 1 ;;
          esac
          case "$TARGET:$desc" in
            *-linux-musl:*"dynamically linked"* | *-linux-musl:*interpreter*)
              echo "::error::$bin is not statically linked"
              exit 1
              ;;
            *-linux-musl:*"statically linked"* | *-linux-musl:*"static-pie linked"*) ;;
            *-linux-musl:*) echo "::error::can't tell whether $bin is statically linked"; exit 1 ;;
          esac
          # Run every build this runner can run: natively, under qemu or under Rosetta.
          run=()
          case "$TARGET" in
            x86_64-unknown-linux-musl | aarch64-apple-darwin) ;;
            aarch64-unknown-linux-musl)
              qemu=$(command -v qemu-aarch64-static || command -v qemu-aarch64 || true)
              [ -n "$qemu" ] || { echo "::error::qemu-user installed no qemu-aarch64"; exit 1; }
              run=("$qemu")
              ;;
            x86_64-apple-darwin)
              if arch -x86_64 /usr/bin/true 2> /dev/null; then
                run=(arch -x86_64)
              else
                echo "::warning::Rosetta is not installed on this runner; $bin was not run"
                exit 0
              fi
              ;;
          esac
          out=$("${run[@]}" "$bin" --version)
          echo "$out"
          if [ "$out" != "twr ${TAG#v}" ]; then
            echo "::error::$bin --version printed '$out', expected 'twr ${TAG#v}'"
            exit 1
          fi

      # A release hub ignores TWR_TEST_USER_TOKEN_FILE: a client under an agent marker that
      # presents the token is still refused a user-only request. x86_64 only: the gate is
      # target-independent (cfg!(debug_assertions)), and a hub under qemu-user is untested.
      - name: Check that the release build ignores the test token
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: python3 -I .github/scripts/test-token-check.py --twr "target/$TARGET/release/twr" --expect refuse

      - name: Install cargo-about
        run: cargo install --locked --features cli cargo-about@0.9.2

      # The licences and notices of the crates in the binary (about.toml, about.hbs).
      - name: Write the third-party licences
        run: cargo about generate --locked --fail -o THIRD-PARTY-LICENSES.html about.hbs

      - id: package
        name: Package
        shell: bash
        run: |
          archive="twr-$TARGET.tar.gz"
          mkdir -p dist/stage
          cp "target/$TARGET/release/twr" LICENSE NOTICE THIRD-PARTY-LICENSES.html README.md dist/stage/
          cp -R docs dist/stage/docs
          # docs/tools holds the maintainers' scripts (screenshots, link check), not docs.
          rm -r dist/stage/docs/tools
          tar -C dist/stage -czf "dist/$archive" twr LICENSE NOTICE THIRD-PARTY-LICENSES.html README.md docs
          rm -r dist/stage
          files=$(tar -tzf "dist/$archive")
          for f in twr LICENSE NOTICE THIRD-PARTY-LICENSES.html README.md; do
            grep -qx "$f" <<< "$files" || { echo "::error::$archive has no top-level $f"; exit 1; }
          done
          if command -v sha256sum > /dev/null; then
            sum=$(sha256sum "dist/$archive" | awk '{ print $1 }')
          else
            sum=$(shasum -a 256 "dist/$archive" | awk '{ print $1 }')
          fi
          ls -l dist
          echo "$sum  $archive"
          echo "sha256_${TARGET//-/_}=$sum" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: twr-${{ matrix.target }}
          path: dist/twr-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    name: publish the release
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Deploys only from `v*` tags and `main` (a manual rebuild); see docs/development.md.
    environment: release
    # The only job that may write: the release (contents), and the archives' build provenance
    # (an OIDC token for Sigstore, and the attestations).
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # The tagged commit, for its install.sh (a release asset, signed) and the public key the
      # signatures are checked against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Check that the checkout is the tagged commit
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          head=$(git rev-parse HEAD)
          if [ -z "$SHA" ] || [ "$head" != "$SHA" ]; then
            echo "::error::checked out $head, but refs/tags/$TAG is ${SHA:-unresolved}"
            exit 1
          fi

      # By exact name: nothing but these four artifacts can land in dist/.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: twr-x86_64-unknown-linux-musl
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: twr-aarch64-unknown-linux-musl
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: twr-aarch64-apple-darwin
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: twr-x86_64-apple-darwin
          path: dist

      # sha256sums.txt starts with `# twr release <tag>` (sha256sum -c skips it) and lists the
      # tagged commit's install.sh too. Signed with the rest, the line ties the checksums to
      # this release and the installer to them: `twr update` and install.sh refuse checksums
      # that name another release than the one asked for, and `twr update` an installer they
      # don't list.
      - name: Check the archives against the builds and write the checksums
        env:
          BUILT: ${{ toJSON(needs.build.outputs) }}
        run: |
          targets="x86_64-unknown-linux-musl aarch64-unknown-linux-musl aarch64-apple-darwin x86_64-apple-darwin"
          expected=$(for t in $targets; do echo "twr-$t.tar.gz"; done | sort)
          actual=$(find dist -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          if [ "$actual" != "$expected" ]; then
            echo "::error::dist/ holds:"$'\n'"$actual"$'\n'"expected:"$'\n'"$expected"
            exit 1
          fi
          printf '# twr release %s\n' "$TAG" > sha256sums.txt
          for t in $targets; do
            archive="twr-$t.tar.gz"
            want=$(jq -r --arg k "sha256_${t//-/_}" '.[$k] // ""' <<< "$BUILT")
            got=$(sha256sum "dist/$archive" | awk '{ print $1 }')
            if ! [[ "$want" =~ ^[0-9a-f]{64}$ ]] || [ "$got" != "$want" ]; then
              echo "::error::$archive is $got, but its build job recorded '${want}'"
              exit 1
            fi
            echo "$got  $archive" >> sha256sums.txt
          done
          cp install.sh dist/install.sh
          echo "$(sha256sum dist/install.sh | awk '{ print $1 }')  install.sh" >> sha256sums.txt
          mv sha256sums.txt dist/
          cat dist/sha256sums.txt

      # Build provenance for the four archives, checked above against their builds:
      # `gh attestation verify twr-<target>.tar.gz --repo ignaval/twr
      # --signer-workflow ignaval/twr/.github/workflows/release.yml`. Only on a tag push: the
      # provenance names the commit the workflow ran from, which is the tagged commit only then.
      # A manual rebuild runs from main and builds the tag's commit, so it would name the wrong
      # source; its archives keep their signed checksums, without new provenance.
      - if: github.event_name == 'push' && needs.resolve.outputs.sha == github.sha
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/twr-x86_64-unknown-linux-musl.tar.gz
            dist/twr-aarch64-unknown-linux-musl.tar.gz
            dist/twr-aarch64-apple-darwin.tar.gz
            dist/twr-x86_64-apple-darwin.tar.gz
      - if: github.event_name != 'push' || needs.resolve.outputs.sha != github.sha
        run: |
          echo "::notice::no provenance, because this run's commit is not the tag's (a manual rebuild runs from main)"

      # Ed25519 signatures (base64 of the raw 64 bytes) of sha256sums.txt and of the tagged
      # commit's install.sh, which `twr update` and install.sh check against the key in
      # release/signing-key.pub. A missing secret fails the release: releases are never
      # unsigned. docs/tools/make-signing-key.sh made the key.
      - name: Sign the checksums and the installer
        shell: bash
        env:
          TWR_RELEASE_SIGNING_KEY: ${{ secrets.TWR_RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$TWR_RELEASE_SIGNING_KEY" ]; then
            echo "::error::the release environment has no TWR_RELEASE_SIGNING_KEY secret (see docs/tools/make-signing-key.sh); releases are signed"
            exit 1
          fi
          # In a private directory this step makes, recorded for the cleanup step, which removes
          # that directory only: nothing that was already on the runner is written or removed.
          keydir=$(mktemp -d "$RUNNER_TEMP/signing.XXXXXXXX")
          echo "TWR_SIGNING_DIR=$keydir" >> "$GITHUB_ENV"
          key="$keydir/key.pem"
          (umask 077 && set -C && printf '%s\n' "$TWR_RELEASE_SIGNING_KEY" > "$key")
          for f in sha256sums.txt install.sh; do
            openssl pkeyutl -sign -rawin -inkey "$key" -in "dist/$f" | base64 -w0 > "dist/$f.sig"
            # Checked with the committed public key: a secret that is not its private half
            # fails here, not on users' machines.
            base64 -d "dist/$f.sig" > "$RUNNER_TEMP/$f.sig.bin"
            if [ "$(wc -c < "$RUNNER_TEMP/$f.sig.bin")" != 64 ] ||
              ! openssl pkeyutl -verify -rawin -pubin -inkey release/signing-key.pub \
                -sigfile "$RUNNER_TEMP/$f.sig.bin" -in "dist/$f"; then
              echo "::error::the signature of $f does not verify with release/signing-key.pub: TWR_RELEASE_SIGNING_KEY is not the key's private half"
              exit 1
            fi
          done

      - name: Remove the signing key
        if: always()
        run: |
          # Only the directory the signing step made (empty when it didn't get that far).
          if [ -n "${TWR_SIGNING_DIR:-}" ] && [ -d "$TWR_SIGNING_DIR" ] && [ ! -L "$TWR_SIGNING_DIR" ]; then
            if [ -f "$TWR_SIGNING_DIR/key.pem" ] && [ ! -L "$TWR_SIGNING_DIR/key.pem" ]; then
              shred -u "$TWR_SIGNING_DIR/key.pem" || rm -f "$TWR_SIGNING_DIR/key.pem"
            fi
            rm -rf "$TWR_SIGNING_DIR"
          fi

      - name: Check the release assets
        run: |
          targets="x86_64-unknown-linux-musl aarch64-unknown-linux-musl aarch64-apple-darwin x86_64-apple-darwin"
          expected=$(
            for t in $targets; do echo "twr-$t.tar.gz"; done
            printf '%s\n' sha256sums.txt sha256sums.txt.sig install.sh install.sh.sig
          )
          expected=$(sort <<< "$expected")
          actual=$(find dist -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          if [ "$actual" != "$expected" ]; then
            echo "::error::dist/ holds:"$'\n'"$actual"$'\n'"expected:"$'\n'"$expected"
            exit 1
          fi

      - name: Check that the tag still points at the built commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          if ! obj=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha'); then
            echo "::error::could not look up refs/tags/$TAG: it was deleted, or the API call failed (gh's message is above)"
            exit 1
          fi
          read -r type sha <<< "$obj"
          for _ in 1 2 3 4 5; do
            [ "$type" = tag ] || break
            if ! obj=$(gh api "repos/$GH_REPO/git/tags/$sha" --jq '.object.type + " " + .object.sha'); then
              echo "::error::could not read the tag object $sha of refs/tags/$TAG (gh's message is above)"
              exit 1
            fi
            read -r type sha <<< "$obj"
          done
          if [ "$type" != commit ] || [ -z "$SHA" ] || [ "$sha" != "$SHA" ]; then
            echo "::error::refs/tags/$TAG is now $type $sha; the binaries were built from ${SHA:-?}"
            exit 1
          fi

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=false
          case "$TAG" in *-*) prerelease=true ;; esac
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2> /dev/null); then
            gh release upload "$TAG" dist/* --clobber
            # A run interrupted inside `gh release create` leaves a draft: publish it now.
            if [ "$draft" = true ]; then
              gh release edit "$TAG" --draft=false --prerelease="$prerelease"
            fi
            exit 0
          fi
          flags=()
          if [ "$prerelease" = true ]; then
            flags+=(--prerelease)
          fi
          cat > notes.md <<NOTES
          ## Install

          Linux (x86_64, arm64; static) and macOS (Apple silicon, Intel):

          \`\`\`sh
          curl -fsSL https://twr.tools/install.sh | sh
          \`\`\`

          This version only: add \`TWR_VERSION=${TAG}\` before \`sh\`. Or download
          \`twr-<target>.tar.gz\` below, check it against \`sha256sums.txt\`, and put \`twr\` on
          your PATH.

          ## Verify

          \`twr update\` checks \`sha256sums.txt.sig\`, the signature of the checksums, with
          twr's release key before it installs anything, and \`install.sh\` does too where its
          \`openssl\` can (OpenSSL 3; macOS's LibreSSL can't). To check by hand, see
          [docs/install.md](https://github.com/ignaval/twr/blob/main/docs/install.md). Each
          archive also has a build provenance attestation, which the GitHub CLI checks:

          \`\`\`sh
          gh attestation verify twr-<target>.tar.gz --repo ignaval/twr \\
            --signer-workflow ignaval/twr/.github/workflows/release.yml
          \`\`\`
          NOTES
          gh release create "$TAG" --verify-tag --title "twr $TAG" --generate-notes \
            --notes-file notes.md "${flags[@]}" dist/*
