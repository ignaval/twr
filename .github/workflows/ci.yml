name: CI

# Every push to dev and main and every pull request (`pull_request`, never
# `pull_request_target`: a fork's code runs without the repository's secrets and with a
# read-only token). `gh workflow run ci.yml` also runs the four release builds, before tagging a
# release (docs/development.md).
on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:
    inputs:
      release-builds:
        description: Also run the four release builds (before tagging a release)
        type: boolean
        default: true

# One run per pull request or branch: a new push to a pull request cancels the run of the one
# before. For pushed branches a new run waits for the one in progress, and GitHub keeps one
# waiting run per group: a newer run replaces the one still waiting, which ends cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Actions are pinned to full commit SHAs (the comment names the release); the Rust toolchain is
# the one in rust-toolchain.toml.

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: fmt + shellcheck + doc links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust toolchain (rust-toolchain.toml)
        shell: bash
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"$/\1/p' rust-toolchain.toml)
          [ -n "$channel" ] || { echo "::error::no channel in rust-toolchain.toml"; exit 1; }
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy --no-self-update
          rustc --version
      - run: cargo fmt --all -- --check
      - name: shellcheck
        shell: bash
        run: |
          shopt -s nullglob
          shellcheck install.sh docs/tools/*.sh .github/scripts/*.sh
      - name: Check the docs' relative links
        run: python3 -I docs/tools/check-links.py

  test:
    name: clippy + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust toolchain (rust-toolchain.toml)
        shell: bash
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"$/\1/p' rust-toolchain.toml)
          [ -n "$channel" ] || { echo "::error::no channel in rust-toolchain.toml"; exit 1; }
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy --no-self-update
          rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install Git LFS (the LFS tests of twr-runner skip without it)
        shell: bash
        run: |
          if ! command -v git-lfs > /dev/null; then
            if [ "$RUNNER_OS" = macOS ]; then
              brew install git-lfs
            else
              sudo apt-get update -q
              sudo apt-get install -y -q git-lfs
            fi
          fi
          git lfs version
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Use a temporary directory without symlinks (macOS)
        # macOS's $TMPDIR is under /var, a symlink to /private/var: git and twr report the
        # resolved paths, while tests compare them with the tempdir paths they created.
        if: runner.os == 'macOS'
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - run: cargo test --workspace --locked --no-fail-fast

  ps-backend:
    # macOS reads the process table with `ps` (crates/twr-runner/src/reap/ps.rs). Run the
    # stale-process tests on Linux with that backend too (procps prints the same columns).
    name: reap tests with the ps backend (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTFLAGS: --cfg twr_ps
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust toolchain (rust-toolchain.toml)
        shell: bash
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"$/\1/p' rust-toolchain.toml)
          [ -n "$channel" ] || { echo "::error::no channel in rust-toolchain.toml"; exit 1; }
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy --no-self-update
          rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: twr-ps
      - run: cargo test -p twr-runner --locked --no-fail-fast

  deny:
    # deny.toml: the licences, advisories (RustSec), bans (no OpenSSL, HTTP clients in twr-cli
    # only) and sources (crates.io only) of the dependency graph.
    name: cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust toolchain (rust-toolchain.toml)
        shell: bash
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"$/\1/p' rust-toolchain.toml)
          [ -n "$channel" ] || { echo "::error::no channel in rust-toolchain.toml"; exit 1; }
          rustup toolchain install "$channel" --profile minimal --no-self-update
          rustc --version
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny@0.20.2
      - run: cargo deny check

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint (release binary, checksum pinned)
        run: |
          # The sha256 is the one in the release's actionlint_<version>_checksums.txt.
          version=1.7.12
          sha256=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          if [ "$(uname -m)" != x86_64 ]; then
            echo "::error::the pinned actionlint is for x86_64 Linux, this runner is $(uname -m)"
            exit 1
          fi
          archive="actionlint_${version}_linux_amd64.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}"
          echo "$sha256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
      - name: actionlint (with shellcheck over the run scripts)
        run: |
          # actionlint runs shellcheck on every `run:` script when it finds it on PATH; the
          # Ubuntu runners have it.
          command -v shellcheck > /dev/null || { echo "::error::no shellcheck on this runner"; exit 1; }
          "$RUNNER_TEMP/actionlint" -color

  real-systemd:
    # The rest of the suite replaces systemd-run and systemctl with stand-ins
    # (crates/twr-hub/tests/limits.rs). This job starts a systemd user manager for the runner's
    # user and runs the ignored test that uses the real ones: one worker under cpu_weight and
    # memory_high, its scope and twr.slice checked with `systemctl --user show`.
    name: real systemd (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust toolchain (rust-toolchain.toml)
        shell: bash
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"$/\1/p' rust-toolchain.toml)
          [ -n "$channel" ] || { echo "::error::no channel in rust-toolchain.toml"; exit 1; }
          rustup toolchain install "$channel" --profile minimal --no-self-update
          rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: real-systemd
      - id: manager
        name: Start a systemd user manager
        shell: bash
        run: |
          sudo loginctl enable-linger "$USER"
          XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export XDG_RUNTIME_DIR
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          state=""
          for _ in $(seq 30); do
            state=$(systemctl --user is-system-running 2> /dev/null || true)
            case "$state" in
              running | degraded)
                echo "the user manager is $state"
                echo "up=true" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
            sleep 1
          done
          echo "::notice::no systemd user manager came up in 30 s (it says '${state:-nothing}'); the real-systemd test is skipped"
      - name: The real-systemd test
        if: steps.manager.outputs.up == 'true'
        env:
          # A user manager answered: the test must not skip.
          TWR_TEST_REQUIRE_SYSTEMD: "1"
        run: cargo test -p twr-hub --locked --test limits -- --ignored real_systemd --nocapture

  release-build:
    # The release builds (release.yml), without publishing: the musl cross builds with
    # cargo-zigbuild and both macOS builds from the arm64 runner. Setup, commands, flags and
    # checks are release.yml's; keep them in step. A failure here would otherwise first show
    # on the tag push. Only on a manual run (`gh workflow run ci.yml`), before tagging: they
    # are the slow jobs.
    if: github.event_name == 'workflow_dispatch' && inputs.release-builds
    name: release build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, zig: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, zig: true }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain (rust-toolchain.toml)
        shell: bash
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"$/\1/p' rust-toolchain.toml)
          [ -n "$channel" ] || { echo "::error::no channel in rust-toolchain.toml"; exit 1; }
          rustup toolchain install "$channel" --profile minimal --target "$TARGET" --no-self-update
          version=$(rustc --version)
          case "$version" in
            "rustc $channel "*) echo "$version" ;;
            *) echo "::error::rustc is $version, rust-toolchain.toml says $channel"; exit 1 ;;
          esac

      - name: Read the workspace version
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "twr-cli") | .version')
          if [ -z "$version" ] || [ "$version" = null ]; then
            echo "::error::no twr-cli package in the workspace"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Install zig and cargo-zigbuild
        if: matrix.zig
        run: |
          # The hashes are those of the x86_64 Linux wheels on PyPI (the same as release.yml).
          if [ "$(uname -m)" != x86_64 ]; then
            echo "::error::the pinned zig wheels are for x86_64 Linux, this runner is $(uname -m)"
            exit 1
          fi
          cat > "$RUNNER_TEMP/zig-requirements.txt" <<'REQ'
          cargo-zigbuild==0.23.4 --hash=sha256:0a149a2a07b9513d422efa9cc23e1add9741f08abe86845fa418eaeb4cca7931
          ziglang==0.14.1 --hash=sha256:6eb9d4d759b292c83810dbee2e9e8e3fbfbf01d864e6e9811bae711fd74e1c2f
          REQ
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install --quiet --require-hashes --only-binary :all: --no-deps \
            -r "$RUNNER_TEMP/zig-requirements.txt"
          echo "$RUNNER_TEMP/zig/bin" >> "$GITHUB_PATH"

      - name: Install qemu (to run the arm64 Linux build)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-user-static

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.zig }}" = "true" ]; then
            cargo zigbuild --release --locked -p twr-cli --target "$TARGET"
          else
            cargo build --release --locked -p twr-cli --target "$TARGET"
          fi

      - name: Check the binary
        shell: bash
        run: |
          bin="target/$TARGET/release/twr"
          desc=$(file -b "$bin")
          echo "$bin: $desc"
          case "$TARGET:$desc" in
            x86_64-*:*x86-64* | x86_64-*:*x86_64* | aarch64-*:*aarch64* | aarch64-*:*arm64*) ;;
            *) echo "::error::$bin is not a $TARGET binary"; exit 1 ;;
          esac
          case "$TARGET:$desc" in
            *-linux-musl:*"dynamically linked"* | *-linux-musl:*interpreter*)
              echo "::error::$bin is not statically linked"
              exit 1
              ;;
            *-linux-musl:*"statically linked"* | *-linux-musl:*"static-pie linked"*) ;;
            *-linux-musl:*) echo "::error::can't tell whether $bin is statically linked"; exit 1 ;;
          esac
          # Run every build this runner can run: natively, under qemu or under Rosetta.
          run=()
          case "$TARGET" in
            x86_64-unknown-linux-musl | aarch64-apple-darwin) ;;
            aarch64-unknown-linux-musl)
              qemu=$(command -v qemu-aarch64-static || command -v qemu-aarch64 || true)
              [ -n "$qemu" ] || { echo "::error::qemu-user-static installed no qemu-aarch64"; exit 1; }
              run=("$qemu")
              ;;
            x86_64-apple-darwin)
              if arch -x86_64 /usr/bin/true 2> /dev/null; then
                run=(arch -x86_64)
              else
                echo "::warning::Rosetta is not installed on this runner; $bin was not run"
                exit 0
              fi
              ;;
          esac
          out=$("${run[@]}" "$bin" --version)
          echo "$out"
          if [ "$out" != "twr $VERSION" ]; then
            echo "::error::$bin --version printed '$out', expected 'twr $VERSION'"
            exit 1
          fi

      # A release hub ignores TWR_TEST_USER_TOKEN_FILE: a client under an agent marker that
      # presents the token is still refused a user-only request. x86_64 only: the gate is
      # target-independent (cfg!(debug_assertions)), and a hub under qemu-user is untested.
      - name: Check that the release build ignores the test token
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: python3 -I .github/scripts/test-token-check.py --twr "target/$TARGET/release/twr" --expect refuse

      - name: Install cargo-about
        run: cargo install --locked --features cli cargo-about@0.9.2

      - name: Write the third-party licences
        run: cargo about generate --locked --fail -o THIRD-PARTY-LICENSES.html about.hbs

      - name: Package (not published)
        shell: bash
        run: |
          archive="twr-$TARGET.tar.gz"
          mkdir -p dist/stage
          cp "target/$TARGET/release/twr" LICENSE NOTICE THIRD-PARTY-LICENSES.html README.md dist/stage/
          cp -R docs dist/stage/docs
          rm -r dist/stage/docs/tools
          tar -C dist/stage -czf "dist/$archive" twr LICENSE NOTICE THIRD-PARTY-LICENSES.html README.md docs
          rm -r dist/stage
          # install.sh needs `twr` at the top level; the dev scripts in docs/tools stay out.
          files=$(tar -tzf "dist/$archive")
          echo "$files"
          for f in twr LICENSE NOTICE THIRD-PARTY-LICENSES.html README.md; do
            grep -qx "$f" <<< "$files" || { echo "::error::$archive has no top-level $f"; exit 1; }
          done
          if grep -q '^docs/tools' <<< "$files"; then
            echo "::error::$archive holds docs/tools"
            exit 1
          fi
