# cargo-deny's rules for twr's dependency graph (`cargo deny check`; CI's deny job runs it).
# cargo-deny 0.20, version 2 of its advisories and licenses schema
# (https://embarkstudios.github.io/cargo-deny/).

[graph]
# Every target and feature, so a dependency of the macOS build or of a test counts too.
all-features = true

[advisories]
version = 2
# The RustSec advisory database. A vulnerability fails the check, and so does an unmaintained
# crate anywhere in the graph or an unsound one a workspace crate depends on directly (the
# defaults); a yanked version warns. An `ignore` entry needs its reason.
ignore = []

[licenses]
version = 2
# Exactly the licences twr's dependencies have today, all permissive and compatible with
# Apache-2.0 for a binary distribution; THIRD-PARTY-LICENSES.html (cargo-about, about.toml)
# carries their notices in each release archive. A dependency with any other licence, copyleft
# included, fails the check until it is reviewed and added here.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
deny = [
    # TLS is rustls (with ring); nothing links OpenSSL.
    { crate = "openssl", reason = "TLS is rustls only" },
    { crate = "openssl-sys", reason = "TLS is rustls only" },
    # HTTP clients stay in twr-cli (`twr update`, through reqwest). Each entry lists the only
    # crates that may depend on it directly, so the chain ends at twr-cli; the hub, the runner
    # and the rest make no HTTP requests. (The runner's wss:// connection is tungstenite's.)
    { crate = "reqwest", wrappers = ["twr-cli"], reason = "HTTP clients in twr-cli only" },
    { crate = "hyper-rustls", wrappers = ["reqwest"], reason = "HTTP clients in twr-cli only" },
    { crate = "hyper-util", wrappers = ["hyper-rustls", "reqwest"], reason = "HTTP clients in twr-cli only" },
    { crate = "hyper", wrappers = ["hyper-rustls", "hyper-util", "reqwest"], reason = "HTTP clients in twr-cli only" },
]

[sources]
# crates.io only: no other registry, no git dependency.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
