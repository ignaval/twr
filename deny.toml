# cargo-deny's rules for twr's dependency graph (`cargo deny check`; CI's deny job runs it).
# cargo-deny 0.20, version 2 of its advisories and licenses schema
# (https://embarkstudios.github.io/cargo-deny/).

[graph]
# Every target and feature, so a dependency of the macOS build or of a test counts too.
all-features = true

[advisories]
version = 2
# The RustSec advisory database. A vulnerability fails the check, and so does an unmaintained
# crate anywhere in the graph or an unsound one a workspace crate depends on directly (the
# defaults); a yanked version warns. An `ignore` entry needs its reason.
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained, with no safe upgrade. It is no vulnerability, and iroh, rmcp and schemars depend on it, so twr moving its own code to jiff or time would not clear it; the event log's timestamps are chrono's RFC 3339 serde form" },
]

[licenses]
version = 2
# Exactly the licences twr's dependencies have today, all permissive and compatible with
# Apache-2.0 for a binary distribution; THIRD-PARTY-LICENSES.html (cargo-about, about.toml)
# carries their notices in each release archive. A dependency with any other licence, copyleft
# included, fails the check until it is reviewed and added here.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
# Build-time only: sherpa-onnx-sys's build script unpacks its prebuilt libraries with `zip`,
# whose bzip2 and PPMd decoders carry these permissive licences. Nothing of theirs is in a
# twr binary.
exceptions = [
    { crate = "libbz2-rs-sys", allow = ["bzip2-1.0.6"] },
    { crate = "ppmd-rust", allow = ["MIT-0"] },
]

[bans]
multiple-versions = "warn"
deny = [
    # TLS is rustls (with ring); nothing links OpenSSL.
    { crate = "openssl", reason = "TLS is rustls only" },
    { crate = "openssl-sys", reason = "TLS is rustls only" },
    # HTTP is owned by the updater, application gateway and linked-runner discovery.
    # Core and worker executors cannot introduce direct HTTP clients.
    # The relay server (`twr-relay`'s `server` feature) adds two: tokio-rustls-acme's ACME
    # client, and iroh-metrics' `service` feature, which iroh-relay's server turns on.
    { crate = "reqwest", wrappers = ["twr-cli", "twr-app", "iroh", "iroh-relay", "n0-dns-resolver", "pkarr", "tokio-rustls-acme", "iroh-metrics"], reason = "HTTP clients in updater, app gateway, link discovery and the relay's ACME and metrics only" },
    { crate = "axum", wrappers = ["twr-app"], reason = "HTTP listener in the application gateway only" },
    { crate = "axum-server", wrappers = ["twr-app"], reason = "TLS listener in the application gateway only" },
    { crate = "hyper-rustls", wrappers = ["reqwest"], reason = "HTTP TLS through reqwest only" },
    { crate = "hyper-util", wrappers = ["hyper-rustls", "reqwest", "axum", "axum-server", "iroh-relay", "twr-app", "twr-relay", "iroh-metrics"], reason = "HTTP in the updater, application gateway and relay only" },
    { crate = "hyper", wrappers = ["hyper-rustls", "hyper-util", "reqwest", "axum", "axum-server", "iroh-relay", "twr-relay", "iroh-metrics"], reason = "HTTP in the updater, application gateway and relay only" },
]

[sources]
# crates.io only: no other registry, no git dependency.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
